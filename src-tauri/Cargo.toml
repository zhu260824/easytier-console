[package]
name = "easytier-console"
version = "1.0.0"
description = "EasyTier 网络控制台 —— 查看节点状态、子网代理、端口转发与路由，一键启停核心"
authors = []
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/zhu260824/easytier-console"
readme = "../README.md"
keywords = ["easytier", "vpn", "mesh", "tauri", "gui"]
categories = ["gui", "network-programming"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 启用系统托盘图标（右键菜单、左键唤起窗口）
# image: 托盘图标和窗口图标解码需要
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
